[project]
name = "pkit"
version = "0.1.0"
description = "Python toolkit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "questionary>=2.1.1",
    "tomlkit>=0.13.2",
]

[project.scripts]
uvrun = "uvrun.main:main"
enforce_uv_policy = "enforce_uv_policy.main:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.workspace]
members = [
    "tests/sample",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

